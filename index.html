<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunrise Apartments AMS</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('sunrise_ams_theme');
        var prefersDark = false;
        try {
          if (typeof window !== 'undefined' && typeof window.matchMedia === 'function') {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            if (mq && typeof mq.matches === 'boolean') {
              prefersDark = mq.matches;
            }
          }
        } catch (e) {
          prefersDark = false;
        }

        var isDark = false;
        if (stored === 'dark') {
          isDark = true;
        } else if (stored === 'light') {
          isDark = false;
        } else {
          // 'system', undefined, or unrecognized: follow OS dark mode, fallback to light
          isDark = prefersDark;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
