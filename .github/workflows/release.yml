name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Ensure GitHub Release Exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $existing = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if ($null -eq $existing) {
            Write-Host "Creating draft release $tag..."
            gh api -X POST "repos/${{ github.repository }}/releases" `
              -f tag_name="$tag" `
              -f target_commitish="${{ github.sha }}" `
              -f name="$version" `
              -F draft=true `
              -F generate_release_notes=true | Out-Null
          } else {
            Write-Host "Reusing existing release $tag (id=$($existing.id), draft=$($existing.draft))."
          }

      - name: Build and Publish Windows Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
        run: npx electron-builder --win --publish always

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $existing = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if ($null -ne $existing -and $existing.draft) {
            Write-Host "Publishing draft release $tag (id=$($existing.id))..."
            gh api -X PATCH "repos/${{ github.repository }}/releases/$($existing.id)" `
              -F draft=false | Out-Null
          } else {
            Write-Host "Release $tag is already published."
          }
